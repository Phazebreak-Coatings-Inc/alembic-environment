[project]
name = "database_util"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14.5"
dependencies = [
    "database_core",
    "alembic>=1.18.4",
    "inflection>=0.5.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.14.1",
    "rich>=13.0",
    "sqlacodegen>=4.0.3",
    "sqlalchemy>=2.0.50",
    "sqlglot>=25.0",
    "sqlmodel>=0.0.38",
    "typer>=0.26.6",
]

[project.scripts]
models = "database_util.clis.models.app:app"
migrations = "database_util.clis.migrations.app:app"
environments = "database_util.clis.environments.app:app"

[tool.uv.sources]
database_core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"
