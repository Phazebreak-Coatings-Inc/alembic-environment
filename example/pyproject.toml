[project]
name = "example_project"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "database-core",
    "database-util",
    "environments",
    "migrations",
    "models",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["database/database_core", "database/database_util", "database/models", "database/migrations", "database/environments"]

[tool.uv.sources]
database-core = { workspace = true }
database-util = { workspace = true }
models = { workspace = true }
migrations = { workspace = true }
environments = { workspace = true }

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "copier>=9.15.1",
    "debugpy>=1.8.21",
    "inflection>=0.5.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pytest>=9.1.1",
    "pytest-alembic>=0.12.1",
    "ruff>=0.15.15",
    "skylos>=4.29.0",
    "sqlacodegen>=4.0.3",
    "sqlalchemy>=2.0.50",
    "sqlglot>=30.12.0",
    "sqlmodel>=0.0.38",
    "tomlkit>=0.15.0",
    "typer>=0.26.6",
]
