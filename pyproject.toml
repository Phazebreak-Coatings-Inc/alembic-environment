[project]
name = "alembic-environment"
version = "0.4.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "copier>=9.15.1",
    "copier-template>=0.1.10",
    "tomlkit>=0.15.0",
    "typer>=0.26.6",
]

[project.urls]
Homepage = "https://phazebreak-coatings-inc.github.io/alembic-environment"
Documentation = "https://phazebreak-coatings-inc.github.io/alembic-environment/"
Repository = "https://github.com/Phazebreak-Coatings-Inc/alembic-environment"

[project.scripts]
alembic-environment = "alembic_environment.__main__:main"
alembic_environment = "alembic_environment.__main__:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"


[tool.pytest.ini_options]
markers = ["slow: builds the example project", "docker: needs a running docker daemon"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "example",
]
testpaths = ["tests", "template/database"]

[tool.ruff]
exclude = ["example"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (syntax, undefined names, etc.)
    "I",    # isort (clean and sorted imports)
    "UP",   # pyupgrade (upgrades syntax to your target Python version)
    "B",    # flake8-bugbear (catches design flaws and subtle bugs)
    "SIM",  # flake8-simplify (suggests simpler code structures)
    "C90",
]

[tool.uv.workspace]
members = [
    "template/database/models",
    "template/database/migrations",
    "template/database/environments",
    "template/database/database_util",
    "template/database/database_core",
]
exclude = ["example"]

[tool.uv.sources]
copier-template = { git = "https://github.com/Phazebreak-Coatings-Inc/copier-template", branch = "019" }
database_util = { workspace = true }
database_core = { workspace = true }
models = { workspace = true }
migrations = { workspace = true }
environments = { workspace = true }

[dependency-groups]
dev = [
    "skylos>=4.29.0",
    "debugpy>=1.8.21",
    "alembic>=1.18.4",
    "sqlalchemy>=2.0.50",
    "sqlmodel>=0.0.38",
    "models",
    "migrations",
    "environments",
    "database_util",
    "database_core",
    "pytest-alembic>=0.12.1",
    "pytest>=9.1.1",
    "pydantic-settings>=2.14.1",
    "psycopg[binary]>=3.3.4",
    "ruff>=0.15.15",
    "tomlkit>=0.15.0",
    "sqlacodegen>=4.0.3",
    "inflection>=0.5.1",
    "logfire[sqlalchemy]>=5.1.1",
    "copier>=9.15.1",
    "typer>=0.26.6",
    "sqlglot>=30.12.0",
]

docs = [
    "zensical>=0.0.43"
]
